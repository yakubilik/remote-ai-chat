<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Remote AI Chat</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0F0E0C; }
      body {
        font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
        color: #F1ECE3;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: rgba(241,236,227,0.12); border-radius: 5px; border: 3px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(241,236,227,0.22); border: 3px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-track { background: transparent; }
      button { font: inherit; color: inherit; }
      input, textarea { font: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
