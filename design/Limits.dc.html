<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .bar { height: 5px; border-radius: 3px; background: rgba(241,236,227,0.10); overflow: hidden; }
    .fill { height: 5px; border-radius: 3px; }
    .row { display: flex; flex-direction: column; gap: 7px; padding: 12px 14px; }
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .lab { font-size: 14px; font-weight: 500; line-height: 18px; }
    .sub { font-size: 12px; line-height: 16px; color: #8C8578; }
  </style>
</helmet>
<div style="width: 390px; height: 560px; background: #0F0E0C; color: #F1ECE3; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden;">

  <div style="flex-grow: 1;"></div>

  <div style="margin: 0px 12px 8px 12px; border-radius: 16px; background: #201D1A; border: 1px solid rgba(241,236,227,0.10); overflow: hidden;">

    <div class="row" style="border-bottom: 1px solid rgba(241,236,227,0.08);">
      <div class="top">
        <div class="lab">5 saatlik</div>
        <div class="sub">3 sa 53 dk sonra sıfırlanır</div>
      </div>
      <div class="bar"><div class="fill" style="width: 6%; background: #4C8DD9;"></div></div>
      <div class="sub" style="color: #6E6860;">%6</div>
    </div>

    <div class="row" style="border-bottom: 1px solid rgba(241,236,227,0.08);">
      <div class="top">
        <div class="lab">Haftalık · tüm modeller</div>
        <div class="sub">Cuma 10:00</div>
      </div>
      <div class="bar"><div class="fill" style="width: 51%; background: #4C8DD9;"></div></div>
      <div class="sub" style="color: #6E6860;">%51</div>
    </div>

    <div class="row" style="border-bottom: 1px solid rgba(241,236,227,0.08);">
      <div class="top">
        <div class="lab">Haftalık · Opus</div>
        <div class="sub">Cuma 10:00</div>
      </div>
      <div class="bar"><div class="fill" style="width: 87%; background: #D8A657;"></div></div>
      <div class="sub" style="color: #6E6860;">%87</div>
    </div>

    <div style="padding: 11px 14px; display: flex; align-items: center; gap: 8px;">
      <div class="sub">Bu hesap: work · you@work.example</div>
    </div>
  </div>

  <div style="padding: 8px 12px 16px 12px; display: flex; align-items: center; gap: 10px;">
    <div style="flex-grow: 1; height: 46px; border-radius: 23px; background: #1A1815; border: 1px solid rgba(241,236,227,0.10); display: flex; align-items: center; padding: 0px 16px;">
      <div style="font-size: 15px; color: #6E6860;">Bir şey yaz…</div>
    </div>

    <div style="width: 34px; height: 34px; position: relative; display: flex; align-items: center; justify-content: center;">
      <svg width="34" height="34" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="14" fill="none" stroke="rgba(241,236,227,0.13)" stroke-width="3.4"></circle>
        <circle cx="18" cy="18" r="14" fill="none" stroke="#D8A657" stroke-width="3.4" stroke-linecap="round"
                stroke-dasharray="87.9 100" transform="rotate(-90 18 18)"></circle>
      </svg>
      <div style="position: absolute; font-size: 10px; font-weight: 600; color: #D8A657;">87</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
